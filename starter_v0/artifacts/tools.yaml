# starter_v0 — tool declarations.
# Names and descriptions here match the implementations in tools/__init__.py
# and the contracts in data/eval_base.json.
# `pytest tests/test_tool_contract.py` checks this sync for you.

tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi câu hỏi cho người dùng để làm rõ thông tin thiếu hoặc xin xác nhận trước khi thực hiện hành động. BẮT BUỘC GỌI TOOL NÀY (KHÔNG trả lời bằng text thường) khi: (1) Thiếu thông tin cần thiết như thiếu tên tài khoản Twitter của bài đăng, thiếu địa chỉ URL bài viết cần đọc; (2) Người dùng yêu cầu đăng/gửi bài lên Telegram nhưng chưa xác nhận yes/no."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi ngắn gọn gửi tới người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' để hỏi thông tin tự do (xin URL, xin tài khoản); 'yes_no' khi cần người dùng xác nhận trước khi gửi/đăng bài; 'choice' khi đưa ra các lựa chọn"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách các lựa chọn khi response_type là choice"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter/X cụ thể. DÙNG KHI: xem bài viết của một người dùng hoặc tổ chức cụ thể khi đã biết chính xác tên tài khoản (handle). KHÔNG DÙNG KHI: tìm kiếm từ khóa chung (dùng social_search), hoặc khi người dùng không nói rõ tài khoản của ai (phải gọi clarify)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (handle) không chứa ký tự '@' (ví dụ: 'sama', 'karpathy')"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng tối đa cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm bài đăng trên mạng xã hội Twitter/X theo từ khóa hoặc chủ đề thảo luận. DÙNG KHI: tìm xem mọi người đang bàn tán gì về một chủ đề/từ khóa (ví dụ: 'GPT-5', 'OpenAI'). KHÔNG DÙNG KHI: xem bài của một tài khoản cá nhân cụ thể (dùng timeline)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm trên mạng xã hội (loại bỏ từ nối, chỉ giữ từ khóa chính)"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp bài viết: 'Top' cho các bài đăng phổ biến nhất/nổi bật nhất; 'Latest' cho các bài đăng mới nhất"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần tìm"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin, bài viết, tin tức trên internet qua web search. DÙNG KHI: tìm kiếm tin tức thời sự, báo chí hoặc tra cứu kiến thức web tổng quát. Đặt topic='news' khi tìm tin tức mới/tin thời sự."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm cốt lõi trên web (ví dụ: 'AI', 'robotics')"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: 'news' cho tin tức báo chí, sự kiện thời sự mới; 'general' cho tra cứu thông tin kiến thức chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay; 'week' cho tuần này/trong tuần; 'month' cho tháng này; 'year' cho năm nay"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa cần trả về"}
      required: [query]

  - name: fetch
    description: "Đọc và trích xuất toàn bộ nội dung từ một địa chỉ URL trang web. DÙNG KHI: đã có URL cụ thể bắt đầu bằng http:// hoặc https://. KHÔNG DÙNG KHI: chưa có URL (khi đó phải gọi clarify để hỏi xin link)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ của trang web cần đọc"}
      required: [url]

  - name: format
    description: "Trình bày danh sách dữ liệu thu thập được thành văn bản digest markdown theo cấu trúc đẹp mắt."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item dữ liệu cần format"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề của bản tin"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi tin nhắn hoặc bản tin lên kênh Telegram. CHÚ Ý: CHỈ ĐƯỢC GỌI khi người dùng ĐÃ XÁC NHẬN ĐỒNG Ý trong hội thoại (confirmed=true). Nếu người dùng yêu cầu gửi nhưng chưa có xác nhận rõ ràng, KHÔNG ĐƯỢC gọi tool này mà PHẢI gọi clarify(response_type='yes_no')."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần gửi lên Telegram"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận. Bắt buộc phải là true khi gửi"}
      required: [text]

  - name: policy
    description: "Tìm kiếm trong tài liệu quy định và chính sách nội bộ của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm kiếm chính sách"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách cần tra cứu"}
        top_k: {type: integer, default: 3, description: "Số lượng mục chính sách cần lấy"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học nghiên cứu trên arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm bài báo"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text trích xuất từ một bài báo khoa học arXiv."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ URL bài báo arXiv"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần đọc"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]

  # ---------------- Custom team tools (CP3) ----------------
  - name: calculator
    description: "Thực hiện tính toán biểu thức số học an toàn (cộng, trừ, nhân, chia, phần trăm, lũy thừa). DÙNG KHI: người dùng yêu cầu tính toán con số hoặc biểu thức toán học số liệu cụ thể (ví dụ: '150 * 1.25', 'tính giúp mình 120 / 4')."
    parameters:
      type: object
      properties:
        expression: {type: string, default: "", description: "Biểu thức toán học số học cần tính (ví dụ: '(100 + 50) * 1.2')"}
      required: [expression]
